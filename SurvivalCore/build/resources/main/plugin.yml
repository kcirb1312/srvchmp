name: SurvivalCore
version: '${version}'
main: pl.championsmp.survivalcore.SurvivalCore
api-version: '1.21'
author: ChampionSMP
description: Core plugin dla serwera ChampionSMP.pl

commands:
  register:
    description: Rejestracja konta gracza Non-Premium.
    usage: /register <haslo> <haslo>
  login:
    description: Logowanie do konta gracza Non-Premium.
    usage: /login <haslo>
  sklep:
    description: Otwiera menu wyboru sklepow.
    usage: /sklep
  rynek:
    description: Otwiera rynek aukcji graczy.
    usage: /rynek
  wystaw:
    description: Wystawia trzymany przedmiot na rynek graczy.
    aliases: [ wystawprzedmiot ]
